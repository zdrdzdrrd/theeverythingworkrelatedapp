<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodolfo's Workspace</title>
<meta name="description" content="Rodolfo's workspace: projects, tasks with checklists and logs, notes, calendar and timeline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workspace">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #fbfbfa; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Notion-style shell. Fixed sidebar of pages on the left, one wide canvas on the right,
   a slide-in peek panel for task details. Collapses to an off-canvas sidebar on phones. */
:root {
  --bg: #fbfbfa;
  --side: #f5f5f2;
  --card: #ffffff;
  --fg: #2c2b28;
  --fg-2: #5f5e59;
  --muted: #8f8d86;
  --line: #e9e8e3;
  --line-2: #dcdad3;
  --hover: rgba(55, 53, 47, .055);
  --press: rgba(55, 53, 47, .09);
  --accent: #2f6bd0;
  --accent-soft: rgba(47, 107, 208, .1);
  --accent-ink: #ffffff;
  --good: #1f8a5b;
  --good-soft: rgba(31, 138, 91, .12);
  --warn: #b07200;
  --warn-soft: rgba(237, 161, 0, .16);
  --bad: #cf3f35;
  --bad-soft: rgba(207, 63, 53, .1);
  --shadow: 0 1px 2px rgba(15, 15, 10, .05), 0 8px 24px rgba(15, 15, 10, .08);
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #eda100;
  --c4: #e87ba4; --c5: #008300; --c6: #4a3aa7; --c7: #e34948;
  --f-display: "Bricolage Grotesque", "Geist", ui-sans-serif, system-ui, sans-serif;
  --f-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --side-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191918; --side: #1f1f1e; --card: #232322; --fg: #e8e7e2; --fg-2: #b9b8b2; --muted: #8a8983;
    --line: #2e2e2c; --line-2: #3a3a37; --hover: rgba(255, 255, 255, .055); --press: rgba(255, 255, 255, .09);
    --accent: #5b93ec; --accent-soft: rgba(91, 147, 236, .16); --accent-ink: #0d1b30;
    --good: #3fbf86; --good-soft: rgba(63, 191, 134, .14); --warn: #e0a42a; --warn-soft: rgba(224, 164, 42, .16);
    --bad: #ef6b62; --bad-soft: rgba(239, 107, 98, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .45);
    --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500;
    --c4: #d55181; --c5: #2f9a2f; --c6: #9085e9; --c7: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191918; --side: #1f1f1e; --card: #232322; --fg: #e8e7e2; --fg-2: #b9b8b2; --muted: #8a8983;
  --line: #2e2e2c; --line-2: #3a3a37; --hover: rgba(255, 255, 255, .055); --press: rgba(255, 255, 255, .09);
  --accent: #5b93ec; --accent-soft: rgba(91, 147, 236, .16); --accent-ink: #0d1b30;
  --good: #3fbf86; --good-soft: rgba(63, 191, 134, .14); --warn: #e0a42a; --warn-soft: rgba(224, 164, 42, .16);
  --bad: #ef6b62; --bad-soft: rgba(239, 107, 98, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .45);
  --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500;
  --c4: #d55181; --c5: #2f9a2f; --c6: #9085e9; --c7: #e66767;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
::selection { background: var(--accent-soft); }
#root { height: 100%; }
svg[aria-hidden] { width: 15px; height: 15px; flex: none; }

.shell { display: flex; height: 100%; }
.side { width: var(--side-w); flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; overflow-y: auto; }
.main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
.ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px 10px; }
.ws-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font: 700 13px/1 var(--f-display); }
.ws-name { font-weight: 600; font-size: 14px; }
.ws-sub { font-size: 12px; color: var(--muted); }
.nav { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 6px; color: var(--fg-2); font-weight: 500; width: 100%; text-align: left; min-height: 30px; }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--press); color: var(--fg); }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .8; }
.nav .count { margin-left: auto; font: 500 11px var(--f-mono); color: var(--muted); }
.nav .count.bad { color: var(--bad); }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.icon-btn { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn svg { width: 16px; height: 16px; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.side-foot { margin-top: auto; padding: 10px 8px 2px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.sync.local { background: var(--warn); }

.topbar { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px; align-items: center; gap: 10px; }
.scrim { display: none; }

.page { max-width: 980px; margin: 0 auto; padding: 44px 48px 80px; display: flex; flex-direction: column; gap: 28px; }
.page.wide { max-width: none; padding-inline: 32px; }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.h1 { font: 700 36px/1.15 var(--f-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.h1-input { font: 700 36px/1.15 var(--f-display); letter-spacing: -.01em; border: 0; background: transparent; width: 100%; padding: 0; outline: none; }
.h1-input::placeholder { color: var(--line-2); }
.sub { color: var(--fg-2); margin: 6px 0 0; }
.desc-input { border: 0; background: transparent; width: 100%; color: var(--fg-2); resize: none; outline: none; padding: 0; margin-top: 8px; line-height: 1.55; }
.desc-input::placeholder { color: var(--muted); }
.h2 { font-size: 13px; font-weight: 600; color: var(--fg-2); margin: 0; display: flex; align-items: center; gap: 8px; }
.h2 .n { font: 500 12px var(--f-mono); color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; font-weight: 500; font-size: 13px; color: var(--fg-2); border: 1px solid var(--line-2); background: var(--card); min-height: 30px; }
.btn:hover { background: var(--hover); color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn svg { width: 15px; height: 15px; }
.seg { display: inline-flex; padding: 2px; background: var(--hover); border-radius: 7px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 4px 10px; border-radius: 5px; font-size: 13px; color: var(--fg-2); font-weight: 500; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--card); display: flex; flex-direction: column; gap: 4px; text-align: left; }
button.tile:hover { border-color: var(--line-2); }
.tile .k { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.tile .v { font: 600 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile .v.bad { color: var(--bad); }
.tile .hint { font-size: 12px; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; }
.panel-box { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 16px; min-width: 0; }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; transform: translate(-50%, -100%); background: var(--fg); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; margin-top: -8px; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* progress */
.prog { display: flex; flex-direction: column; gap: 12px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-align: left; padding: 4px 6px; margin: -4px -6px; border-radius: 6px; }
.prog-row:hover { background: var(--hover); }
.prog-row .name { display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; }

/* task list */
.list { display: flex; flex-direction: column; }
.task { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; min-height: 36px; cursor: pointer; }
.task:hover { background: var(--hover); }
.task + .task { border-top: 1px solid var(--line); border-radius: 0; }
.task:hover + .task { border-top-color: transparent; }
.task .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.check { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--line-2); flex: none; display: grid; place-items: center; background: var(--card); }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check svg { width: 12px; height: 12px; }
.meta { display: flex; align-items: center; gap: 6px; flex: none; font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 7px; border-radius: 5px; background: var(--hover); color: var(--fg-2); white-space: nowrap; line-height: 20px; }
.chip.due-bad { background: var(--bad-soft); color: var(--bad); }
.chip.due-today { background: var(--warn-soft); color: var(--warn); }
.chip.p-high { background: var(--bad-soft); color: var(--bad); }
.chip.p-medium { background: var(--warn-soft); color: var(--warn); }
.chip.p-low { background: var(--hover); color: var(--fg-2); }
.chip.s-doing { background: var(--accent-soft); color: var(--accent); }
.chip.s-done { background: var(--good-soft); color: var(--good); }
.chip svg { width: 12px; height: 12px; }
.empty { color: var(--muted); padding: 14px 8px; font-size: 13px; }
.add { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 6px; color: var(--muted); min-height: 36px; }
.add:focus-within { background: var(--hover); }
.add input { border: 0; background: transparent; flex: 1; outline: none; min-width: 0; padding: 4px 0; }
.add input::placeholder { color: var(--muted); }
.add svg { width: 16px; height: 16px; flex: none; }
.add select { border: 1px solid var(--line-2); background: var(--card); border-radius: 5px; font-size: 12px; padding: 2px 4px; max-width: 140px; }

/* board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--hover); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; transition: background .12s; }
.col.over { background: var(--accent-soft); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-size: 13px; font-weight: 600; }
.col-h .n { font: 500 12px var(--f-mono); color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 7px; cursor: grab; box-shadow: 0 1px 1px rgba(0, 0, 0, .03); text-align: left; }
.card:hover { border-color: var(--line-2); }
.card.dragging { opacity: .45; }
.card .t { font-weight: 500; overflow-wrap: anywhere; }
.card.done .t { color: var(--muted); text-decoration: line-through; }
.card .meta { flex-wrap: wrap; }
.col .add { min-height: 32px; }

/* peek panel */
.peek-scrim { position: fixed; inset: 0; background: rgba(15, 15, 10, .18); z-index: 40; }
.peek { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 41; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
.peek-bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.peek-body { padding: 22px 28px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.peek-body > * { flex-shrink: 0; }
.title-area { font: 700 26px/1.25 var(--f-display); border: 0; background: transparent; resize: none; outline: none; width: 100%; padding: 0; overflow: hidden; }
.props { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; align-items: center; font-size: 13.5px; }
.props .pk { color: var(--muted); display: flex; align-items: center; gap: 7px; min-height: 32px; }
.props .pk svg { width: 15px; height: 15px; }
.props select, .props input[type=date] { border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 6px; margin-left: -6px; max-width: 100%; }
.props select:hover, .props input[type=date]:hover { background: var(--hover); }
.notes-area { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-height: 160px; resize: vertical; padding: 10px 12px; outline: none; line-height: 1.6; width: 100%; }
.notes-area:focus { border-color: var(--line-2); }
.peek-foot { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

/* notes */
.notes-wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100%; }
.notes-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.notes-list .search { margin: 0 4px 10px; }
.note-item { text-align: left; padding: 8px 10px; border-radius: 7px; display: flex; flex-direction: column; gap: 2px; }
.note-item:hover { background: var(--hover); }
.note-item.on { background: var(--press); }
.note-item .nt { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item .np { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item .nm { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.note-ed { overflow-y: auto; }
.note-ed .page { gap: 14px; max-width: 760px; }
.body-area { border: 0; background: transparent; outline: none; resize: none; width: 100%; min-height: 50vh; line-height: 1.7; font-size: 15px; padding: 0; }
.md { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3 { font-family: var(--f-display); margin: 1.1em 0 .3em; line-height: 1.25; }
.md h1 { font-size: 26px; } .md h2 { font-size: 21px; } .md h3 { font-size: 17px; }
.md p { margin: 0 0 .7em; }
.md ul { margin: 0 0 .7em; padding-left: 1.3em; }
.md li.todo { list-style: none; margin-left: -1.3em; display: flex; gap: 8px; align-items: baseline; }
.md li.todo .check { transform: translateY(3px); }
.md li.todo.done span { color: var(--muted); text-decoration: line-through; }
.md code { font-family: var(--f-mono); font-size: .88em; background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: 0 0 .7em; padding-left: 14px; border-left: 3px solid var(--line-2); color: var(--fg-2); }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.input { border: 1px solid var(--line-2); background: var(--card); border-radius: 6px; padding: 6px 10px; outline: none; width: 100%; }
.input:focus { border-color: var(--accent); }
.note-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.note-card { border: 1px solid var(--line); border-radius: 9px; background: var(--card); padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
.note-card:hover { border-color: var(--line-2); }
.note-card .nt { font-weight: 600; }
.note-card .np { color: var(--fg-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-card .nm { margin-top: auto; font-size: 12px; color: var(--muted); }

/* feed */
.feed { display: flex; flex-direction: column; gap: 2px; }
.ev { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 5px 0; font-size: 13.5px; }
.ev .ic { width: 18px; height: 18px; display: grid; place-items: center; color: var(--muted); align-self: center; }
.ev .ic svg { width: 15px; height: 15px; }
.ev .ic.good { color: var(--good); }
.ev .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.ev .txt b { color: var(--fg); font-weight: 500; }
.ev .when { font: 12px var(--f-mono); color: var(--muted); }

/* timeline */
.tl-wrap { border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: auto; max-height: calc(100vh - 230px); min-height: 280px; position: relative; }
.tl { position: relative; }
.tl-row { display: flex; height: 36px; position: relative; }
.tl-row.proj { height: 34px; background: var(--bg); }
.tl-label { position: sticky; left: 0; z-index: 3; flex: none; background: var(--card); border-right: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 12px; overflow: hidden; white-space: nowrap; font-size: 13px; cursor: pointer; }
.tl-row.proj .tl-label { background: var(--bg); font-weight: 600; cursor: default; }
.tl-label .t { overflow: hidden; text-overflow: ellipsis; }
.tl-label:hover .t { text-decoration: underline; text-decoration-color: var(--line-2); }
.tl-track { position: relative; flex: none; border-bottom: 1px solid var(--line); }

.tl-days { height: 22px; position: relative; }
.tl-days span { position: absolute; top: 2px; font: 10.5px var(--f-mono); color: var(--muted); text-align: center; }

.tl-bg { position: absolute; top: 0; bottom: 0; pointer-events: none; }

.tl-span { position: absolute; top: 15px; height: 4px; border-radius: 2px; opacity: .55; }

/* palette */

.pal-res { max-height: 50vh; overflow-y: auto; padding: 6px; }

.pal-item.on, .pal-item:hover { background: var(--hover); }
.pal-item .k { margin-left: auto; font-size: 12px; color: var(--muted); }
.pal-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.kbd { font: 11px var(--f-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

.color-pick button.on { border-color: var(--fg); }
.menu-pop { position: absolute; right: 0; top: 34px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; z-index: 30; display: flex; flex-direction: column; gap: 10px; width: 240px; }

/* v2: work-order features */

.steps { display: flex; flex-direction: column; }

.stepr:hover { background: var(--hover); }

.step-text { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 3px 0; }

.step-date.empty { color: var(--muted); opacity: .55; }

.icon-btn.armed { color: var(--bad); background: var(--bad-soft); }
.composer { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; }

.tpill.t-call { --tc: var(--good); }
.tpill.t-issue { --tc: var(--bad); }
.entries { display: flex; flex-direction: column; gap: 8px; }

.banner { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; background: var(--hover); color: var(--fg-2); font-size: 13px; }
.banner.good { background: var(--good-soft); color: var(--good); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.linkbtn { color: var(--accent); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.filters { display: flex; flex-direction: column; gap: 10px; }
.search-in { flex: 1 1 220px; width: auto; }
.sort-in { flex: 0 0 auto; width: auto; }
.chips-row { gap: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--fg-2); background: var(--card); }
.fchip svg { width: 13px; height: 13px; }
.fchip .mono { font-size: 11px; color: var(--muted); }
.fchip:hover { border-color: var(--muted); }
.fchip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.fchip.on .mono { color: inherit; opacity: .7; }
.fchip.bad:not(.on) { color: var(--bad); border-color: var(--bad-soft); }
.vsep { width: 1px; height: 18px; background: var(--line-2); }
.tpl-row { gap: 6px; padding-left: 8px; }

.tpl button:first-child { padding: 3px 4px 3px 9px; color: var(--fg-2); font-weight: 500; }
.tpl button:first-child:hover { color: var(--accent); }

.grp { cursor: pointer; text-align: left; }
.caret { display: inline-flex; transition: transform .12s; }
.caret svg { width: 13px; height: 13px; }
.task.step { min-height: 34px; }
.linkchip { cursor: pointer; }
.linkchip:hover { background: var(--press); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.cal-dow { padding: 6px 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em; }
.cal-cell { min-height: 108px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.cal-cell:nth-child(7n) { border-right: 0; }

.cal-cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-d { display: flex; align-items: center; justify-content: space-between; }
.cal-n { font: 500 12.5px var(--f-mono); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }

.cal-count { display: none; font-size: 11px; color: var(--muted); }
.cal-items { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal-item { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 4px; border-radius: 4px; text-align: left; min-width: 0; }
.cal-item:hover { background: var(--press); }

.cal-item .dot { width: 7px; height: 7px; border-radius: 2px; }
.cal-more { font-size: 11px; color: var(--muted); padding-left: 4px; display: inline-flex; gap: 3px; align-items: center; }

.modal { width: min(640px, 100%); }

.data-btn { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--card); }
.data-btn:hover:not(:disabled) { border-color: var(--accent); }

/* If the app can't start (a script failed to load or crashed), say so instead of spinning forever. */
(function () {
  var errors = [];
  window.__bootErrors = errors;
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "SCRIPT") errors.push("Couldn't load " + (t.getAttribute("src") || "a script"));
    else if (e.message) errors.push(e.message);
  }, true);
  window.addEventListener("unhandledrejection", function (e) { errors.push(String(e.reason && (e.reason.message || e.reason.code) || e.reason)); });
  window.__showBootProblem = function (headline) {
    if (window.__appReady) return;
    var root = document.getElementById("root");
    if (!root) return;
    var box = document.createElement("div");
    box.className = "loading";
    box.innerHTML = '<div style="display:grid;gap:10px;justify-items:center;text-align:center;max-width:440px;padding:0 16px">' +
      '<b style="font-size:15px;color:var(--fg)"></b><span class="boot-detail"></span>' +
      '<button class="btn primary" type="button">Reload</button></div>';
    box.querySelector("b").textContent = headline;
    box.querySelector(".boot-detail").textContent = errors.length ? "Details: " + errors.slice(-3).join(" · ") : "";
    box.querySelector("button").onclick = function () { location.reload(); };
    root.replaceChildren(box);
  };
  setTimeout(function () {
    if (!window.React || !window.ReactDOM || !window.htm) window.__showBootProblem("The app's code didn't load.");
  }, 8000);
})();
</script>

<script>
"use strict";

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
const fmtDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => fmtDate(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };

const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function dueLabel(s) {
  const d = diffDays(today(), s);
  if (d === 0) return "Today";
  if (d === 1) return "Tomorrow";
  if (d === -1) return "Yesterday";
  if (d > 1 && d < 7) return DOW[parseDate(s).getDay()];
  const p = parseDate(s);
  return MON[p.getMonth()] + " " + p.getDate() + (p.getFullYear() !== new Date().getFullYear() ? ", " + p.getFullYear() : "");

  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  if (s < 86400 * 7) return Math.floor(s / 86400) + "d";

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Opened as its own website (GitHub Pages) rather than inside Claude: save in this browser, keep photos inline, download files directly.

    catch (e) {

    }

const STATUS = [["todo", "To do"], ["doing", "In progress"], ["done", "Done"]];
const PRIOS = [["none", "No priority"], ["low", "Low"], ["medium", "Medium"], ["high", "High"]];
const PRANK = { high: 0, medium: 1, low: 2, none: 3 };
const ENTRY_TYPES = [["note", "Note"], ["measurement", "Measurement"], ["decision", "Decision"], ["call", "Call"], ["issue", "Issue"]];
const ENTRY_LABEL = Object.fromEntries(ENTRY_TYPES);
const RECUR = [["", "Doesn't repeat"], ["daily", "Every day"], ["weekly", "Every week"], ["biweekly", "Every 2 weeks"], ["monthly", "Every month"]];
const RECUR_LABEL = Object.fromEntries(RECUR);
const ARCHIVE_DAYS = 30;
const isArchived = t => !!t.archived || (t.status === "done" && !!t.completedAt && t.completedAt < Date.now() - ARCHIVE_DAYS * 864e5);
const preview = (b, n) => (b || "").replace(/\[[ xX]\]/g, "").replace(/[#*_`>]/g, "").replace(/^\s*[-]\s+/gm, "").replace(/\s+/g, " ").trim().slice(0, n);
const pcolor = p => `var(--c${(p && p.color) || 0})`;
const fmtNum = n => n ? "#" + n : "";
const stepsOf = t => { const s = t.subtasks || []; return { done: s.filter(x => x.done).length, total: s.length, late: t.status === "done" ? 0 : s.filter(x => !x.done && x.due && x.due < today()).length }; };
function nextRecur(s, r) {
  if (!s) return s;
  if (r === "daily") return addDays(s, 1);
  if (r === "weekly") return addDays(s, 7);
  if (r === "biweekly") return addDays(s, 14);
  if (r === "monthly") { const d = parseDate(s); const day = d.getDate(); const n = new Date(d.getFullYear(), d.getMonth() + 1, 1); n.setDate(Math.min(day, new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate())); return fmtDate(n); }
  return s;
}
function sortTasks(list, mode) {
  const byDue = (a, b) => {
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;
    return 0;
  };
  const byPrio = (a, b) => PRANK[a.priority || "none"] - PRANK[b.priority || "none"];
  return list.slice().sort((a, b) => {
    const ad = a.status === "done", bd = b.status === "done";
    if (ad !== bd) return ad ? 1 : -1;
    if (mode === "newest") return (b.createdAt || 0) - (a.createdAt || 0);
    const r = mode === "priority" ? (byPrio(a, b) || byDue(a, b)) : (byDue(a, b) || byPrio(a, b));

function matchesSearch(t, q, st) {

function nextNum() { return Math.max(0, ...Object.values(S.tasks).map(t => t.num || 0)) + 1; }

  if (status === "done" && !wasDone && t.recur && !t.spawnedNext) {

function useDebounced(value, save, delay) {
  const first = useRef(true);
  const saveRef = useRef(save); saveRef.current = save;
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    const t = setTimeout(() => saveRef.current(value), delay);
    return () => clearTimeout(t);
  }, [value]);
}

  const ref = useRef(null);

  return html`<textarea ref=${ref} rows="1" class=${className} value=${value} placeholder=${placeholder} aria-label=${ariaLabel || placeholder} autoFocus=${autoFocus}
    onInput=${e => onChange(e.target.value)} onBlur=${onBlur} onKeyDown=${e => { if (onKeyDown) return onKeyDown(e); if (e.key === "Enter" && className && className.includes("title")) { e.preventDefault(); e.target.blur(); } }}></textarea>`;
}

/* ---------- dashboard ---------- */
function CompletedChart({ tasks }) {
  const [hover, setHover] = useState(-1);
  const days = 14, t0 = today();
  const data = [];
  for (let i = days - 1; i >= 0; i--) data.push({ d: addDays(t0, -i), done: 0, added: 0 });
  const idx = {}; data.forEach((x, i) => idx[x.d] = i);
  tasks.forEach(t => {
    if (t.completedAt) { const k = fmtDate(new Date(t.completedAt)); if (k in idx) data[idx[k]].done++; }
  });
  const max = Math.max(4, ...data.map(x => x.done));
  const niceMax = max <= 4 ? 4 : Math.ceil(max / 2) * 2;
  const W = 560, H = 170, L = 26, B = 22, T = 8;
  const cw = (W - L) / days, bw = Math.min(22, cw * .56);
  const y = v => T + (H - T - B) * (1 - v / niceMax);
  const total = data.reduce((s, x) => s + x.done, 0);
  const ticks = [0, niceMax / 2, niceMax];
  const hx = hover >= 0 ? ((L + cw * hover + cw / 2) / W * 100) : 0;
  return html`<div class="section">
    <div class="row"><h3 class="h2">Tasks completed, last 14 days</h3><span class="spacer"></span><span class="mono muted" style=${{ fontSize: 12 }}>${total} total</span></div>
    <div class="chart">
      <svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${`Tasks completed per day over the last 14 days, ${total} in total`}>
        ${ticks.map(v => html`<g key=${v}><line x1=${L} x2=${W} y1=${y(v)} y2=${y(v)} stroke="var(--line)" stroke-width="1" />
          <text x=${L - 8} y=${y(v) + 4} text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${v}</text></g>`)}
        ${data.map((x, i) => {
          const cx = L + cw * i + cw / 2, h = y(0) - y(x.done);
          const isT = i === days - 1;
          const r = Math.min(4, h / 2);
          const path = h > 0 ? `M${cx - bw / 2},${y(0)} V${y(x.done) + r} Q${cx - bw / 2},${y(x.done)} ${cx - bw / 2 + r},${y(x.done)} H${cx + bw / 2 - r} Q${cx + bw / 2},${y(x.done)} ${cx + bw / 2},${y(x.done) + r} V${y(0)} Z` : "";
          const lab = parseDate(x.d);
          return html`<g key=${x.d}>
            ${h > 0 && html`<path d=${path} fill="var(--accent)" opacity=${hover === -1 || hover === i ? 1 : .45} />`}
            ${(i % 2 === 1 || isT) && html`<text x=${cx} y=${H - 6} text-anchor="middle" font-size="10.5" fill=${isT ? "var(--fg)" : "var(--muted)"} font-weight=${isT ? 600 : 400} font-family="var(--f-mono)">${isT ? "Today" : lab.getDate()}</text>`}
            <rect x=${L + cw * i} y=${T} width=${cw} height=${H - T - B} fill="transparent" onMouseEnter=${() => setHover(i)} onMouseLeave=${() => setHover(-1)} />
          </g>`;
        })}
        <line x1=${L} x2=${W} y1=${y(0)} y2=${y(0)} stroke="var(--line-2)" stroke-width="1" />
      </svg>
      ${hover >= 0 && html`<div class="tip" style=${{ left: hx + "%", top: (y(data[hover].done) / H * 100) + "%" }}>${dueLabel(data[hover].d)}: ${data[hover].done} done</div>`}
    </div>
  </div>`;
}

function deriveEvents(st) {
  const ev = [];
  Object.values(st.tasks).forEach(t => {
    ev.push({ at: t.createdAt, kind: "add", text: "Added", name: t.title || "Untitled task", go: { task: t.id } });
    if (t.completedAt) ev.push({ at: t.completedAt, kind: "done", text: "Completed", name: t.title || "Untitled task", go: { task: t.id } });
  });
  Object.values(st.tasks).forEach(t => (t.entries || []).forEach(e => ev.push({ at: e.at, kind: "log", text: "Logged a " + (ENTRY_LABEL[e.type] || "note").toLowerCase() + " on", name: t.title || "Untitled task", go: { task: t.id } })));
  Object.values(st.notes).forEach(n => {
    ev.push({ at: n.updatedAt || n.createdAt, kind: "note", text: (n.updatedAt - n.createdAt > 60000) ? "Edited note" : "Wrote note", name: n.title || "Untitled note", go: { view: "notes", id: n.id } });
  });
  Object.values(st.projects).forEach(p => ev.push({ at: p.createdAt, kind: "proj", text: "Started project", name: p.name || "Untitled", go: { view: "project", id: p.id } }));
  return ev.filter(e => e.at).sort((a, b) => b.at - a.at);
}

function Dashboard({ st, go, openTask }) {
  const t0 = today();
  const tasks = Object.values(st.tasks);
  const open = tasks.filter(t => t.status !== "done");
  const overdue = open.filter(t => t.due && t.due < t0);
  const dueToday = open.filter(t => t.due === t0);
  const weekAgo = Date.now() - 7 * 864e5;
  const doneWeek = tasks.filter(t => t.completedAt && t.completedAt >= weekAgo).length;
  const doing = open.filter(t => t.status === "doing").length;
  const lateSteps = open.reduce((n, t) => n + stepsOf(t).late, 0);
  const upcoming = sortTasks(open.filter(t => t.due && t.due >= t0 && t.due <= addDays(t0, 7)));
  const projects = Object.values(st.projects).sort((a, b) => a.createdAt - b.createdAt);
  const events = deriveEvents(st).slice(0, 10);
  const h = new Date().getHours();
  const greet = h < 5 ? "Working late" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const now = new Date();
  const focus = sortTasks([...overdue, ...dueToday]).slice(0, 6);
  return html`<div class="page">
    <div>
      <div class="crumb">${now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</div>
      <h1 class="h1" style=${{ marginTop: 4 }}>${greet}, ${OWNER}</h1>
      <p class="sub">${open.length === 0 ? "Nothing open. Add a task or start a project to get going." : `You have ${dueToday.length} ${dueToday.length === 1 ? "task" : "tasks"} due today${overdue.length ? ` and ${overdue.length} running late` : ""}.`}</p>
    </div>
    ${projects.length === 0 && tasks.length === 0 ? html`<div class="welcome">
      <h2 class="h2" style=${{ fontSize: 16, color: "var(--fg)" }}>Set up your workspace</h2>
      <p class="muted" style=${{ margin: 0 }}>Projects hold tasks, notes and a timeline. Start with whatever is on your mind this week.</p>
      <div class="row"><button class="btn primary" onClick=${() => { const p = newProject({}); go({ view: "project", id: p.id, fresh: true }); }}><${Icon} n="plus" />New project</button>
      <button class="btn" onClick=${() => { const n = newNote({}); go({ view: "notes", id: n.id }); }}><${Icon} n="note" />Write a note</button></div>
    </div>` : null}
    <div class="tiles">
      <button class="tile" onClick=${() => go({ view: "today" })}><span class="k">Open tasks</span><span class="v">${open.length}</span><span class="hint">${doing} in progress</span></button>
      <button class="tile" onClick=${() => go({ view: "today" })}><span class="k">Due today</span><span class="v">${dueToday.length}</span><span class="hint">${upcoming.filter(t => t.due !== t0).length} more this week</span></button>
      <button class="tile" onClick=${() => go({ view: "today" })}><span class="k">Overdue</span><span class=${"v" + (overdue.length ? " bad" : "")}>${overdue.length}</span><span class="hint">${lateSteps ? `${lateSteps} checklist ${lateSteps === 1 ? "step" : "steps"} late too` : overdue.length ? "Needs a new date" : "All on track"}</span></button>
      <div class="tile"><span class="k">Done this week</span><span class="v">${doneWeek}</span><span class="hint">Last 7 days</span></div>
    </div>
    <div class="grid2">
      <div class="section">
        <h3 class="h2">Focus now <span class="n">${focus.length}</span></h3>
        <div class="list">
          ${focus.map(t => html`<${TaskRow} key=${t.id} t=${t} projects=${st.projects} showProject open=${openTask} />`)}
          ${focus.length === 0 && html`<div class="empty">Nothing due today or overdue.</div>`}
          <${QuickAdd} due=${t0} projects=${st.projects} placeholder="Add a task for today" />
        </div>
      </div>
      <div class="section">
        <h3 class="h2">Coming up this week <span class="n">${upcoming.filter(t => t.due !== t0).length}</span></h3>
        <div class="list">
          ${upcoming.filter(t => t.due !== t0).slice(0, 7).map(t => html`<${TaskRow} key=${t.id} t=${t} projects=${st.projects} open=${openTask} />`)}
          ${upcoming.filter(t => t.due !== t0).length === 0 && html`<div class="empty">No due dates in the next 7 days.</div>`}
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel-box"><${CompletedChart} tasks=${tasks} /></div>
      <div class="panel-box section">
        <h3 class="h2">Projects</h3>
        <div class="prog">
          ${projects.map(p => {
            const ts = tasks.filter(t => t.projectId === p.id);
            const done = ts.filter(t => t.status === "done").length;
            const pct = ts.length ? Math.round(done / ts.length * 100) : 0;
            return html`<button key=${p.id} class="prog-row" onClick=${() => go({ view: "project", id: p.id })}>
              <span class="name"><span class="dot" style=${{ background: pcolor(p) }}></span>${p.name || "Untitled"}</span>
              <span class="mono muted" style=${{ fontSize: 12 }}>${done}/${ts.length} · ${pct}%</span>
              <span class="bar"><i style=${{ width: pct + "%", background: pcolor(p) }}></i></span>
            </button>`;
          })}
          ${projects.length === 0 && html`<div class="empty" style=${{ padding: 0 }}>No projects yet.</div>`}
        </div>
      </div>
    </div>
    <div class="section">
      <h3 class="h2">Recent activity</h3>
      <div class="feed">
        ${events.map((e, i) => html`<div key=${i} class="ev">
          <span class=${"ic" + (e.kind === "done" ? " good" : "")}><${Icon} n=${e.kind === "done" ? "done" : e.kind === "log" ? "log" : e.kind === "note" ? "note" : e.kind === "proj" ? "folder" : "plus"} /></span>
          <span class="txt">${e.text} <b style=${{ cursor: "pointer" }} onClick=${() => e.go.task ? openTask(e.go.task) : go(e.go)}>${e.name}</b></span>
          <span class="when">${ago(e.at)}</span>
        </div>`)}
        ${events.length === 0 && html`<div class="empty" style=${{ padding: 0 }}>Your activity will show up here.</div>`}
      </div>
    </div>
  </div>`;
}

/* ---------- all tasks ---------- */
function TasksView({ st, openTask }) {
  const t0 = today();
  const [tab, setTab] = useLS("workspace.tab", "open");
  const [sort, setSort] = useLS("workspace.sort", "due");
  const [q, setQ] = useState("");
  const [tag, setTag] = useState(null);
  const [owner, setOwner] = useState(null);
  const [dueF, setDueF] = useState(null);
  const all = Object.values(st.tasks);
  const inTab = t => tab === "all" ? true : tab === "archived" ? isArchived(t) : tab === "done" ? t.status === "done" && !isArchived(t) : t.status !== "done";
  const dueOk = t => !dueF ? true : dueF === "overdue" ? t.status !== "done" && t.due && t.due < t0 : dueF === "today" ? t.due === t0 : t.due && t.due >= t0 && t.due <= addDays(t0, 7);
  const list = all.filter(t => inTab(t) && dueOk(t) && (!tag || (t.tags || []).includes(tag)) && (!owner || t.assignee === owner) && matchesSearch(t, q, st));
  const tags = allTags(st);
  const owners = [...new Set(all.filter(t => !isArchived(t) && t.assignee).map(t => t.assignee))].sort();
  const counts = { overdue: all.filter(t => t.status !== "done" && t.due && t.due < t0).length, today: all.filter(t => t.status !== "done" && t.due === t0).length, week: all.filter(t => t.status !== "done" && t.due && t.due >= t0 && t.due <= addDays(t0, 7)).length };
  const grouped = sort === "due" && tab === "open";
  const groups = grouped ? [
    ["Overdue", list.filter(t => t.due && t.due < t0)],
    ["Today", list.filter(t => t.due === t0)],
    ["Next 7 days", list.filter(t => t.due && t.due > t0 && t.due <= addDays(t0, 7))],
    ["Later", list.filter(t => t.due && t.due > addDays(t0, 7))],
    ["No date", list.filter(t => !t.due)],
  ] : [[tab === "archived" ? "Archived" : tab === "done" ? "Closed" : tab === "all" ? "All tasks" : "Open", list]];
  const filtered = q || tag || owner || dueF;
  const exportCsv = () => exportTasksCsv(sortTasks(list, sort), st);
  return html`<div class="page">
    <div><div class="crumb"><${Icon} n="sun" /> Every project</div><h1 class="h1">Tasks</h1><p class="sub">Everything across your projects. Closed tasks move to Archived after ${ARCHIVE_DAYS} days.</p></div>
    <div class="section">
      <${QuickAdd} projects=${st.projects} />
      <${TemplateRow} st=${st} openTask=${openTask} />
    </div>
    <div class="filters">
      <div class="row">
        <div class="seg">${[["open", "Open"], ["done", "Closed"], ["archived", "Archived"], ["all", "All"]].map(([k, l]) => html`<button key=${k} class=${tab === k ? "on" : ""} onClick=${() => setTab(k)}>${l}</button>`)}</div>
        <input class="input search-in" type="search" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search titles, notes, tags, checklist, log" aria-label="Search tasks" />
        <select class="input sort-in" value=${sort} onChange=${e => setSort(e.target.value)} aria-label="Sort order">
          <option value="due">Sort by due date</option><option value="priority">Sort by priority</option><option value="newest">Newest first</option>
        </select>
      </div>
      <div class="row chips-row">
        ${[["overdue", "Overdue", counts.overdue], ["today", "Due today", counts.today], ["week", "Next 7 days", counts.week]].map(([k, l, n]) => html`<button key=${k} class=${"fchip" + (dueF === k ? " on" : "") + (k === "overdue" && n ? " bad" : "")} onClick=${() => setDueF(dueF === k ? null : k)}>${l} <span class="mono">${n}</span></button>`)}
        ${tags.length > 0 && html`<span class="vsep"></span>`}
        ${tags.slice(0, 14).map(([g, n]) => html`<button key=${g} class=${"fchip" + (tag === g ? " on" : "")} onClick=${() => setTag(tag === g ? null : g)}><${Icon} n="tag" />${g} <span class="mono">${n}</span></button>`)}
        ${owners.length > 0 && html`<span class="vsep"></span>`}
        ${owners.map(o => html`<button key=${o} class=${"fchip" + (owner === o ? " on" : "")} onClick=${() => setOwner(owner === o ? null : o)}><${Icon} n="user" />${o}</button>`)}
      </div>
      ${(filtered || list.length > 0) && html`<div class="row" style=${{ fontSize: 12.5 }}>
        <span class="muted">${list.length} ${list.length === 1 ? "task" : "tasks"}${filtered ? " match" : ""}</span>
        ${filtered && html`<button class="linkbtn" onClick=${() => { setQ(""); setTag(null); setOwner(null); setDueF(null); }}>Clear filters</button>`}
        <span class="spacer"></span>
        ${st.caps.downloads && list.length > 0 && html`<button class="linkbtn" onClick=${exportCsv}><${Icon} n="download" />Export these to CSV</button>`}
      </div>`}
    </div>
    ${groups.map(([label, items]) => (items.length > 0 || (grouped && label === "Today" && !filtered)) && html`<div class="section" key=${label}>
      <h3 class="h2" style=${label === "Overdue" ? { color: "var(--bad)" } : null}>${label} <span class="n">${items.length}</span></h3>
      <div class="list">${sortTasks(items, sort).map(t => html`<${TaskRow} key=${t.id} t=${t} projects=${st.projects} showProject open=${openTask} />`)}
        ${items.length === 0 && html`<div class="empty">Nothing due today.</div>`}</div>
    </div>`)}
    ${list.length === 0 && !grouped && html`<div class="empty">${filtered ? "No tasks match these filters." : tab === "archived" ? "Nothing archived yet." : "No tasks here yet."}</div>`}
  </div>`;
}

/* ---------- checklist: every step across tasks ---------- */
function ChecklistView({ st, openTask }) {
  const t0 = today();
  const [by, setBy] = useLS("workspace.clgroup", "task");
  const [showDone, setShowDone] = useLS("workspace.cldone", false);
  const [q, setQ] = useState("");
  const [collapsed, setCollapsed] = useState({});
  const items = [];
  Object.values(st.tasks).filter(t => t.status !== "done" && !isArchived(t)).forEach(t => (t.subtasks || []).forEach(s => {
    if (!showDone && s.done) return;
    if (q && !(s.text + " " + t.title + " " + (t.tags || []).join(" ") + " " + t.assignee).toLowerCase().includes(q.toLowerCase())) return;
    items.push({ t, s });
  }));
  const toggle = (t, s) => { const cur = S.tasks[t.id]; patch("tasks", t.id, { subtasks: cur.subtasks.map(x => x.id === s.id ? { ...x, done: !x.done } : x), updatedAt: Date.now() }); };
  let groups;
  if (by === "task") {
    const m = new Map();
    sortTasks([...new Set(items.map(i => i.t))]).forEach(t => m.set(t.id, { key: t.id, label: (fmtNum(t.num) ? fmtNum(t.num) + "  " : "") + (t.title || "Untitled"), task: t, items: [] }));
    items.forEach(i => m.get(i.t.id).items.push(i));
    groups = [...m.values()];
  } else if (by === "due") {
    const g = { late: [], today: [], week: [], later: [], none: [] };
    items.forEach(i => { const d = i.s.due; g[!d ? "none" : d < t0 ? "late" : d === t0 ? "today" : d <= addDays(t0, 7) ? "week" : "later"].push(i); });
    groups = [["late", "Late"], ["today", "Today"], ["week", "Next 7 days"], ["later", "Later"], ["none", "No date"]].map(([k, l]) => ({ key: k, label: l, items: g[k].sort((a, b) => (a.s.due || "").localeCompare(b.s.due || "")) })).filter(x => x.items.length);
  } else {
    groups = [{ key: "todo", label: "To do", items: items.filter(i => !i.s.done) }, { key: "done", label: "Done", items: items.filter(i => i.s.done) }].filter(x => x.items.length);
  }
  const total = items.length, done = items.filter(i => i.s.done).length;
  return html`<div class="page">
    <div><div class="crumb"><${Icon} n="steps" /> Every open task</div><h1 class="h1">Checklist</h1><p class="sub">Every checklist step from your open tasks in one place. Tick them off here without opening each task.</p></div>
    <div class="row">
      <div class="seg">${[["task", "By task"], ["due", "By date"], ["status", "By status"]].map(([k, l]) => html`<button key=${k} class=${by === k ? "on" : ""} onClick=${() => setBy(k)}>${l}</button>`)}</div>
      <input class="input search-in" type="search" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search steps" aria-label="Search checklist steps" />
      <label class="row muted" style=${{ gap: 6, fontSize: 13 }}><input type="checkbox" checked=${showDone} onChange=${e => setShowDone(e.target.checked)} />Show done steps</label>
    </div>
    ${groups.map(g => html`<div class="section" key=${g.key}>
      <button class="h2 grp" onClick=${() => setCollapsed({ ...collapsed, [g.key]: !collapsed[g.key] })} aria-expanded=${!collapsed[g.key]}>
        <span class="caret" style=${{ transform: collapsed[g.key] ? "none" : "rotate(90deg)" }}><${Icon} n="arrowR" /></span>
        <span style=${g.key === "late" ? { color: "var(--bad)" } : null}>${g.label}</span><span class="n">${g.task ? stepsOf(g.task).done + "/" + stepsOf(g.task).total : g.items.length}</span>
        ${g.task && html`<span class="linkbtn" onClick=${e => { e.stopPropagation(); openTask(g.task.id); }}>Open task</span>`}
      </button>
      ${!collapsed[g.key] && html`<div class="list">${g.items.map(({ t, s }) => html`<div key=${s.id} class=${"task step" + (s.done ? " done" : "")} onClick=${() => toggle(t, s)} role="button" tabIndex="0" onKeyDown=${e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), toggle(t, s))}>
        <${Check} small on=${s.done} onClick=${() => toggle(t, s)} />
        <span class="t">${s.text}</span>
        <span class="meta">
          ${by !== "task" && html`<button class="chip linkchip" onClick=${e => { e.stopPropagation(); openTask(t.id); }} title="Open task">${st.projects[t.projectId] && html`<span class="dot" style=${{ background: pcolor(st.projects[t.projectId]) }}></span>`}${fmtNum(t.num)} ${(t.title || "Untitled").slice(0, 32)}</button>`}
          <${DateChip} d=${s.due} done=${s.done} />
        </span>
      </div>`)}</div>`}
    </div>`)}
    ${groups.length === 0 && html`<div class="empty">${q ? "No steps match." : "No open checklist steps. Add steps to a task from its panel."}</div>`}
    ${total > 0 && html`<div class="muted mono" style=${{ fontSize: 12 }}>${done} of ${total} steps shown are done</div>`}
  </div>`;
}

/* ---------- calendar ---------- */
function CalendarView({ st, openTask }) {
  const t0 = today();
  const [cursor, setCursor] = useState(() => t0.slice(0, 7));
  const [day, setDay] = useState(t0);
  const [y, m] = cursor.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7;
  const gridStart = addDays(fmtDate(first), -lead);
  const daysInMonth = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((lead + daysInMonth) / 7);
  const byDay = {};
  const addTo = (d, item) => { (byDay[d] = byDay[d] || []).push(item); };
  Object.values(st.tasks).filter(t => !isArchived(t)).forEach(t => {
    if (t.due) addTo(t.due, { kind: "task", t });
    else if (t.start) addTo(t.start, { kind: "start", t });
    (t.subtasks || []).forEach(s => { if (s.due && !(t.status === "done")) addTo(s.due, { kind: "step", t, s }); });
  });
  const shift = n => { const d = new Date(y, m - 1 + n, 1); setCursor(fmtDate(d).slice(0, 7)); };
  const dayItems = (byDay[day] || []);
  return html`<div class="page wide cal-page">
    <div><div class="crumb"><${Icon} n="grid" /> Every project</div><h1 class="h1">Calendar</h1><p class="sub">Tasks on their due dates, with checklist steps that have their own date.</p></div>
    <div class="row">
      <h2 class="h2" style=${{ fontSize: 16, color: "var(--fg)", minWidth: 150 }}>${first.toLocaleDateString([], { month: "long", year: "numeric" })}</h2>
      <button class="icon-btn" aria-label="Previous month" onClick=${() => shift(-1)}><${Icon} n="arrowL" /></button>
      <button class="btn" onClick=${() => { setCursor(t0.slice(0, 7)); setDay(t0); }}>Today</button>
      <button class="icon-btn" aria-label="Next month" onClick=${() => shift(1)}><${Icon} n="arrowR" /></button>
    </div>
    <div class="cal-grid">
      ${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => html`<div key=${d} class="cal-dow">${d}</div>`)}
      ${Array.from({ length: weeks * 7 }, (_, i) => {
        const ds = addDays(gridStart, i), d = parseDate(ds);
        const items = byDay[ds] || [];
        const tasks = items.filter(x => x.kind !== "step"), steps = items.filter(x => x.kind === "step");
        const out = d.getMonth() !== m - 1;
        const late = ds < t0 && items.some(x => x.kind === "step" ? !x.s.done : x.t.status !== "done");
        return html`<div key=${ds} class=${"cal-cell" + (out ? " out" : "") + (ds === t0 ? " today" : "") + (ds === day ? " sel" : "")} onClick=${() => setDay(ds)} role="button" tabIndex="0" aria-label=${dueLabel(ds) + ", " + items.length + " items"} onKeyDown=${e => e.key === "Enter" && setDay(ds)}>
          <div class="cal-d"><span class=${"cal-n" + (late ? " late" : "")}>${d.getDate()}</span>${items.length > 0 && html`<span class="cal-count mono">${items.length}</span>`}</div>
          <div class="cal-items">
            ${tasks.slice(0, 3).map(x => html`<button key=${x.t.id} class=${"cal-item" + (x.t.status === "done" ? " done" : "")} onClick=${e => { e.stopPropagation(); openTask(x.t.id); }} title=${x.t.title}>
              <span class="dot" style=${{ background: st.projects[x.t.projectId] ? pcolor(st.projects[x.t.projectId]) : "var(--muted)" }}></span><span class="ct">${x.kind === "start" ? "Starts: " : ""}${x.t.title || "Untitled"}</span></button>`)}
            ${tasks.length > 3 && html`<span class="cal-more">+${tasks.length - 3} more</span>`}
            ${steps.length > 0 && html`<span class="cal-more"><${Icon} n="steps" />${steps.length} ${steps.length === 1 ? "step" : "steps"}</span>`}
          </div>
        </div>`;
      })}
    </div>
    <div class="section">
      <h3 class="h2">${parseDate(day).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })} <span class="n">${dayItems.length}</span></h3>
      <div class="list">
        ${dayItems.filter(x => x.kind !== "step").map(x => html`<${TaskRow} key=${x.t.id} t=${x.t} projects=${st.projects} showProject open=${openTask} />`)}
        ${dayItems.filter(x => x.kind === "step").map(x => html`<div key=${x.s.id} class=${"task step" + (x.s.done ? " done" : "")} onClick=${() => openTask(x.t.id)}>
          <${Check} small on=${x.s.done} onClick=${() => { const cur = S.tasks[x.t.id]; patch("tasks", x.t.id, { subtasks: cur.subtasks.map(s => s.id === x.s.id ? { ...s, done: !s.done } : s), updatedAt: Date.now() }); }} />
          <span class="t">${x.s.text}</span><span class="meta"><span class="chip">${fmtNum(x.t.num)} ${(x.t.title || "").slice(0, 30)}</span></span></div>`)}
        ${dayItems.length === 0 && html`<div class="empty">Nothing on this day.</div>`}
        <${QuickAdd} due=${day} projects=${st.projects} placeholder=${"Add a task for " + dueLabel(day)} />
      </div>
    </div>
  </div>`;
}

/* ---------- project ---------- */
function Board({ tasks, projectId, openTask }) {
  const [over, setOver] = useState(null);
  const [drag, setDrag] = useState(null);
  return html`<div class="board">
    ${STATUS.map(([key, label]) => {
      const list = sortTasks(tasks.filter(t => t.status === key));
      return html`<div key=${key} class=${"col" + (over === key ? " over" : "")}
        onDragOver=${e => { e.preventDefault(); setOver(key); }} onDragLeave=${() => setOver(null)}
        onDrop=${e => { e.preventDefault(); setOver(null); const id = e.dataTransfer.getData("text/plain"); const t = S.tasks[id]; if (t && t.status !== key) setStatus(t, key); }}>
        <div class="col-h"><span class=${"chip" + (key === "doing" ? " s-doing" : key === "done" ? " s-done" : "")}>${label}</span><span class="n">${list.length}</span></div>
        ${list.map(t => html`<div key=${t.id} class=${"card" + (t.status === "done" ? " done" : "") + (drag === t.id ? " dragging" : "")} draggable="true" tabIndex="0" role="button"
          onDragStart=${e => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; setDrag(t.id); }} onDragEnd=${() => setDrag(null)}
          onClick=${() => openTask(t.id)} onKeyDown=${e => e.key === "Enter" && openTask(t.id)}>
          <span class="t">${t.num ? html`<span class="num">${fmtNum(t.num)}</span> ` : ""}${t.title || "Untitled"}</span>
          <${TaskMeta} t=${t} compact />
        </div>`)}
        <${QuickAdd} projectId=${projectId} status=${key} compact />
      </div>`;
    })}
  </div>`;
}

function ProjectView({ st, id, fresh, go, openTask }) {
  const p = st.projects[id];
  const [mode, setMode] = useState(() => { try { return localStorage.getItem("workspace.pview") || "board"; } catch (e) { return "board"; } });
  const [name, setName] = useState(p ? p.name : "");
  const [desc, setDesc] = useState(p ? p.description || "" : "");
  const [menu, setMenu] = useState(false);
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (p) { setName(p.name); setDesc(p.description || ""); } setArmed(false); setMenu(false); }, [id]);
  useDebounced(name, v => patch("projects", id, { name: v }), 400);
  useDebounced(desc, v => patch("projects", id, { description: v }), 500);
  const setM = m => { setMode(m); try { localStorage.setItem("workspace.pview", m); } catch (e) {} };
  if (!p) return html`<div class="page"><h1 class="h1">This project was deleted</h1><button class="btn" onClick=${() => go({ view: "dashboard" })}>Back to dashboard</button></div>`;
  const tasks = Object.values(st.tasks).filter(t => t.projectId === id);
  const live = tasks.filter(t => !isArchived(t));
  const archivedN = tasks.length - live.length;
  const notes = Object.values(st.notes).filter(n => n.projectId === id).sort((a, b) => b.updatedAt - a.updatedAt);
  const done = tasks.filter(t => t.status === "done").length;
  const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
  const dated = tasks.filter(t => t.start || t.due).flatMap(t => [t.start, t.due]).filter(Boolean).sort();
  const delProject = () => {
    if (!armed) { setArmed(true); return; }
    tasks.forEach(t => remove("tasks", t.id));
    notes.forEach(n => patch("notes", n.id, { projectId: null }));
    remove("projects", id); go({ view: "dashboard" });
  };
  return html`<div class="page">
    <div>
      <div class="row" style=${{ position: "relative" }}>
        <div class="crumb"><span class="dot" style=${{ background: pcolor(p) }}></span>Project${dated.length ? html` · <span class="mono">${dueLabel(dated[0])} to ${dueLabel(dated[dated.length - 1])}</span>` : ""}</div>
        <span class="spacer"></span>
        <button class="icon-btn" aria-label="Project settings" title="Project settings" onClick=${() => { setMenu(!menu); setArmed(false); }}><${Icon} n="dots" w="3" /></button>
        ${menu && html`<div class="menu-pop">
          <div class="h2">Color</div>
          <div class="color-pick">${[0, 1, 2, 3, 4, 5, 6, 7].map(c => html`<button key=${c} aria-label=${"Color " + (c + 1)} class=${p.color === c ? "on" : ""} style=${{ background: `var(--c${c})` }} onClick=${() => patch("projects", id, { color: c })}></button>`)}</div>
          <button class=${"btn danger" + (armed ? " armed" : "")} onClick=${delProject}><${Icon} n="trash" />${armed ? `Delete project and ${tasks.length} tasks` : "Delete project"}</button>
          ${armed && html`<span class="muted" style=${{ fontSize: 12 }}>Notes in this project are kept. Click again to confirm.</span>`}
        </div>`}
      </div>
      <input class="h1-input" value=${name} placeholder="Untitled project" aria-label="Project name" autoFocus=${!!fresh} onInput=${e => setName(e.target.value)} onKeyDown=${e => e.key === "Enter" && e.target.blur()} style=${{ marginTop: 4 }} />
      <${AutoText} className="desc-input" value=${desc} onChange=${setDesc} placeholder="Add a description" />
    </div>
    <div class="row">
      <div class="seg" role="tablist">
        ${[["board", "Board", "board"], ["list", "List", "list"], ["notes", "Notes", "note"]].map(([k, l]) => html`<button key=${k} role="tab" aria-selected=${mode === k} class=${mode === k ? "on" : ""} onClick=${() => setM(k)}>${l}${k === "notes" && notes.length ? ` ${notes.length}` : ""}</button>`)}
      </div>
      <span class="spacer"></span>
      <span class="mono muted" style=${{ fontSize: 12 }}>${done}/${tasks.length} done · ${pct}%</span>
      <span class="bar" style=${{ width: 90, display: "inline-block" }}><i style=${{ width: pct + "%", background: pcolor(p) }}></i></span>
    </div>
    ${mode !== "notes" && html`<${TemplateRow} st=${st} extra=${{ projectId: id }} openTask=${openTask} />`}
    ${mode === "board" && html`<${Board} tasks=${live} projectId=${id} openTask=${openTask} />`}
    ${mode === "list" && html`<div class="list">
      ${sortTasks(live).map(t => html`<${TaskRow} key=${t.id} t=${t} projects=${st.projects} open=${openTask} />`)}
      <${QuickAdd} projectId=${id} />
    </div>`}
    ${mode !== "notes" && archivedN > 0 && html`<div class="muted" style=${{ fontSize: 12.5 }}>${archivedN} archived ${archivedN === 1 ? "task is" : "tasks are"} hidden. Find ${archivedN === 1 ? "it" : "them"} under Tasks, Archived.</div>`}
    ${mode === "notes" && html`<div class="section">
      <div class="row"><button class="btn" onClick=${() => { const n = newNote({ projectId: id }); go({ view: "notes", id: n.id }); }}><${Icon} n="plus" />New note</button></div>
      <div class="note-cards">
        ${notes.map(n => html`<button key=${n.id} class="note-card" onClick=${() => go({ view: "notes", id: n.id })}>
          <span class="nt">${n.title || "Untitled"}</span><span class="np">${preview(n.body, 160) || "Empty note"}</span><span class="nm">Edited ${ago(n.updatedAt)}</span></button>`)}
      </div>
      ${notes.length === 0 && html`<div class="empty">No notes in this project yet.</div>`}
    </div>`}
  </div>`;
}

/* ---------- task panel ---------- */
function Steps({ t }) {
  const [txt, setTxt] = useState("");
  const [due, setDue] = useState("");
  const [armed, setArmed] = useState(null);
  const steps = t.subtasks || [];
  const save = subs => patch("tasks", t.id, { subtasks: subs, updatedAt: Date.now() });
  const cur = () => S.tasks[t.id].subtasks || [];
  const s = stepsOf(t);
  const add = e => { e.preventDefault(); const text = txt.trim(); if (!text) return; save([...cur(), { id: uid(), text, done: false, due: due || null }]); setTxt(""); };
  const move = (i, d) => { const a = cur().slice(); const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(a); };
  return html`<div class="section">
    <div class="row"><h3 class="h2"><${Icon} n="steps" /> Checklist <span class="n">${s.done}/${s.total}</span></h3><span class="spacer"></span>
      ${s.late > 0 && html`<span class="chip due-bad">${s.late} late</span>`}
      ${s.total > 0 && html`<span class="bar" style=${{ width: 80, display: "inline-block" }}><i style=${{ width: Math.round(s.done / s.total * 100) + "%", background: "var(--good)" }}></i></span>`}</div>
    <div class="steps">
      ${steps.map((x, i) => html`<div key=${x.id} class=${"stepr" + (x.done ? " done" : "")}>
        <${Check} small on=${x.done} onClick=${() => save(cur().map(y => y.id === x.id ? { ...y, done: !y.done } : y))} />
        <input class="step-text" defaultValue=${x.text} aria-label="Step text" onBlur=${e => { const v = e.target.value.trim(); if (v && v !== x.text) save(cur().map(y => y.id === x.id ? { ...y, text: v } : y)); }} onKeyDown=${e => { if (e.key === "Enter") e.target.blur(); if (e.altKey && e.key === "ArrowUp") move(i, -1); if (e.altKey && e.key === "ArrowDown") move(i, 1); }} />
        <input type="date" class=${"step-date" + (x.due ? "" : " empty") + (!x.done && x.due && x.due < today() ? " late" : "")} value=${x.due || ""} aria-label="Step due date" onChange=${e => save(cur().map(y => y.id === x.id ? { ...y, due: e.target.value || null } : y))} />
        <button class=${"icon-btn" + (armed === x.id ? " armed" : "")} aria-label=${armed === x.id ? "Click again to remove" : "Remove step"} title=${armed === x.id ? "Click again to remove" : "Remove step"} onClick=${() => { if (armed !== x.id) return setArmed(x.id); save(cur().filter(y => y.id !== x.id)); setArmed(null); }}><${Icon} n=${armed === x.id ? "trash" : "x"} /></button>
      </div>`)}
      <form class="add" onSubmit=${add}><${Icon} n="plus" /><input value=${txt} onInput=${e => setTxt(e.target.value)} placeholder="Add a step, press Enter" aria-label="New checklist step" /><input type="date" class="step-date" value=${due} onChange=${e => setDue(e.target.value)} aria-label="New step due date" /></form>
    </div>
  </div>`;
}

async function resizeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = url; });
    const MAX = STANDALONE ? 1024 : 1600; let { width: w, height: h } = img;
    if (w > MAX || h > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
    const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(res, "image/jpeg", STANDALONE ? .72 : .85));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error("read")); r.readAsDataURL(b); });
async function uploadImage(blob) {
  if (STANDALONE) { const d = await blobToDataUrl(blob); return { id: d, url: d }; }
  if (!ASSETS) throw { code: "unavailable" };
  try { return await ASSETS.upload(blob, { type: "image/jpeg" }); }
  catch (e) { if (e && e.code === "store_unavailable") { await sleep(800); return await ASSETS.upload(blob, { type: "image/jpeg" }); } throw e; }
}
const blobUrl = id => id && id.startsWith("data:") ? id : "/_blob/" + id;

function Log({ t, st, onImage }) {
  const [type, setType] = useState("note");
  const [text, setText] = useState("");
  const [staged, setStaged] = useState([]);
  const [busy, setBusy] = useState(false);
  const [filter, setFilter] = useState(null);
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null);
  const [editText, setEditText] = useState("");
  const [armed, setArmed] = useState(null);
  const [drag, setDrag] = useState(false);
  const fileRef = useRef(null);
  const entries = t.entries || [];
  const cur = () => S.tasks[t.id].entries || [];
  const save = list => patch("tasks", t.id, { entries: list, updatedAt: Date.now() });
  const stage = async files => {
    const imgs = [...files].filter(f => f.type && f.type.startsWith("image/"));
    if (!imgs.length) return;
    if (!ASSETS && !STANDALONE) { toast("Photos can't be added in this view."); return; }
    setBusy(true);
    try {
      for (const f of imgs) { const b = await resizeImage(f); const r = await uploadImage(b); setStaged(s => [...s, { id: r.id, url: r.url }]); }
    } catch (e) { toast(e && e.code === "quota_exceeded" ? "Photo storage is full. Delete some old photos first." : "A photo didn't upload. Try again."); }
    setBusy(false);
  };
  const add = () => {
    const tx = text.trim();
    if (!tx && !staged.length) return;
    save([...cur(), { id: uid(), at: Date.now(), type, text: tx, pinned: false, images: staged.map(s => s.id) }]);
    setText(""); setStaged([]);
  };
  const copy = async e => {
    const s = `[${ENTRY_LABEL[e.type] || "Note"}] ${new Date(e.at).toLocaleString()}\n${e.text}`;
    try { await navigator.clipboard.writeText(s); toast("Copied entry."); } catch (_) { toast("Couldn't copy. Select the text and copy it instead."); }
  };
  const shown = entries.filter(e => (!filter || e.type === filter) && (!q || (e.text || "").toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.at - a.at);
  const typeCounts = {}; entries.forEach(e => typeCounts[e.type || "note"] = (typeCounts[e.type || "note"] || 0) + 1);
  return html`<div class="section">
    <div class="row"><h3 class="h2"><${Icon} n="log" /> Log <span class="n">${entries.length}</span></h3></div>
    <div class=${"composer" + (drag ? " drag" : "")} onDragOver=${e => { if (ASSETS || STANDALONE) { e.preventDefault(); setDrag(true); } }} onDragLeave=${() => setDrag(false)} onDrop=${e => { e.preventDefault(); setDrag(false); stage(e.dataTransfer.files); }}>
      <div class="type-pills">${ENTRY_TYPES.map(([k, l]) => html`<button key=${k} class=${"tpill t-" + k + (type === k ? " on" : "")} onClick=${() => setType(k)}><${Icon} n=${ENTRY_ICON[k]} />${l}</button>`)}</div>
      <textarea class="composer-in" value=${text} onInput=${e => setText(e.target.value)} rows="3" aria-label="New log entry"
        placeholder=${type === "measurement" ? "e.g. Vout 3.31 V at 25 °C, within spec" : type === "decision" ? "What was decided and why" : type === "call" ? "Who, what was agreed, next step" : type === "issue" ? "What failed, where, how to reproduce" : "Write an update. Paste or drop photos here."}
        onPaste=${e => { const f = [...(e.clipboardData && e.clipboardData.files || [])]; if (f.length) { e.preventDefault(); stage(f); } }}
        onKeyDown=${e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); add(); } }}></textarea>
      ${(staged.length > 0 || busy) && html`<div class="thumbs">${staged.map(s => html`<span key=${s.id} class="thumb"><img src=${s.url} alt="Photo to attach" /><button aria-label="Remove photo" onClick=${() => { setStaged(staged.filter(x => x.id !== s.id)); ASSETS && ASSETS.delete(s.id).catch(() => {}); }}><${Icon} n="x" /></button></span>`)}${busy && html`<span class="thumb busy">Uploading</span>`}</div>`}
      <div class="row">
        ${st.caps.assets && html`<button class="btn ghost" onClick=${() => fileRef.current && fileRef.current.click()}><${Icon} n="camera" />Photo</button>
          <input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${e => { stage(e.target.files); e.target.value = ""; }} />`}
        <span class="spacer"></span><span class="muted hide-sm" style=${{ fontSize: 12 }}>Ctrl + Enter</span>
        <button class="btn primary" disabled=${busy || (!text.trim() && !staged.length)} onClick=${add}>Add ${ENTRY_LABEL[type].toLowerCase()}</button>
      </div>
    </div>
    ${entries.length > 2 && html`<div class="row" style=${{ gap: 6 }}>
      <button class=${"fchip" + (!filter ? " on" : "")} onClick=${() => setFilter(null)}>All <span class="mono">${entries.length}</span></button>
      ${ENTRY_TYPES.filter(([k]) => typeCounts[k]).map(([k, l]) => html`<button key=${k} class=${"fchip" + (filter === k ? " on" : "")} onClick=${() => setFilter(filter === k ? null : k)}>${l} <span class="mono">${typeCounts[k]}</span></button>`)}
      <input class="input" style=${{ flex: "1 1 140px", width: "auto", padding: "3px 8px" }} type="search" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search the log" aria-label="Search the log" />
    </div>`}
    <div class="entries">
      ${shown.map(e => html`<div key=${e.id} class=${"entry t-" + (e.type || "note") + (e.pinned ? " pinned" : "")}>
        <div class="entry-h">
          <span class=${"tpill on t-" + (e.type || "note")}><${Icon} n=${ENTRY_ICON[e.type] || "note"} />${ENTRY_LABEL[e.type] || "Note"}</span>
          <span class="muted mono" style=${{ fontSize: 11.5 }} title=${new Date(e.at).toLocaleString()}>${new Date(e.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}${e.editedAt ? " · edited" : ""}</span>
          <span class="spacer"></span>
          <button class="icon-btn" title=${e.pinned ? "Unpin" : "Pin to top"} aria-label=${e.pinned ? "Unpin entry" : "Pin entry"} style=${e.pinned ? { color: "var(--accent)" } : null} onClick=${() => save(cur().map(x => x.id === e.id ? { ...x, pinned: !x.pinned } : x))}><${Icon} n="pin" /></button>
          <button class="icon-btn" title="Edit" aria-label="Edit entry" onClick=${() => { setEditing(e.id); setEditText(e.text); }}><${Icon} n="edit" /></button>
