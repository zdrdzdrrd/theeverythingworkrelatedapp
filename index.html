/* ---------- backup, CSV and import ---------- */
function csvCell(v) { const s = v == null ? "" : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function saveFile(filename, data) {
  if (STANDALONE) {
    const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000); return true;
  }
  if (!DOWNLOADS) { toast("Saving files isn't available in this view."); return false; }
  try { await DOWNLOADS.save({ filename, data }); return true; }
  catch (e) { if (e && e.code !== "declined") toast("The file wasn't saved. Try again."); return false; }
}
function exportTasksCsv(list, st) {
  const t0 = today();
  const head = ["ID", "Title", "Project", "Status", "Priority", "Owner", "Start", "Due", "Days late", "Steps done", "Steps total", "Repeat", "Tags", "Log entries", "Created", "Closed"];
  const lines = [head.map(csvCell).join(",")];
  list.forEach(t => {
    const s = stepsOf(t);
    const late = t.status !== "done" && t.due && t.due < t0 ? diffDays(t.due, t0) : "";
    lines.push([fmtNum(t.num), t.title, (st.projects[t.projectId] || {}).name || "", isArchived(t) ? "Archived" : (STATUS.find(x => x[0] === t.status) || [, ""])[1], (PRIOS.find(x => x[0] === t.priority) || [, ""])[1], t.assignee, t.start || "", t.due || "", late, s.done, s.total, t.recur ? RECUR_LABEL[t.recur] : "", (t.tags || []).join("; "), (t.entries || []).length, fmtDate(new Date(t.createdAt)), t.completedAt ? fmtDate(new Date(t.completedAt)) : ""].map(csvCell).join(","));
  });
  return saveFile(`tasks-${t0}.csv`, "﻿" + lines.join("\r\n")).then(ok => ok && toast(`Exported ${list.length} ${list.length === 1 ? "task" : "tasks"} to CSV.`));
}
function dataUrlToBlob(u) {
  const m = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(u || ""); if (!m) return null;
  const raw = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
  const a = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
  return new Blob([a], { type: m[1] || "image/jpeg" });
}

function DataModal({ st, close }) {
  const [progress, setProgress] = useState(null);
  const [result, setResult] = useState(null);
  const fileRef = useRef(null);
  const counts = { tasks: Object.keys(st.tasks).length, projects: Object.keys(st.projects).length, notes: Object.keys(st.notes).length, templates: Object.keys(st.templates).length };
  const backup = () => {
    const data = { app: "rodolfo-workspace", version: 2, exportedAt: new Date().toISOString(), projects: Object.values(S.projects), tasks: Object.values(S.tasks), notes: Object.values(S.notes), templates: Object.values(S.templates) };
    saveFile(`workspace-backup-${today()}.json`, JSON.stringify(data, null, 2)).then(ok => ok && toast("Backup saved."));
  };
  const run = async file => {
    setResult(null);
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch (e) { setResult({ error: "That file isn't valid JSON, so nothing was changed." }); return; }
    const writes = [];
    let skippedImages = 0, uploaded = 0;
    if (parsed && parsed.app === "rodolfo-workspace") {
      ["projects", "notes", "templates", "tasks"].forEach(c => (parsed[c] || []).forEach(o => o && o.id && writes.push([c, o])));
    } else if (parsed && Array.isArray(parsed.tickets)) {
      // a backup from the old Work Order app
      let proj = Object.values(S.projects).find(p => p.name === "Work Order");
      if (!proj) { proj = { id: uid(), name: "Work Order", description: "Tickets imported from the Work Order app.", color: 5, createdAt: Date.now() }; writes.push(["projects", proj]); }
      const used = new Set(Object.values(S.tasks).map(t => t.num));
      let n = nextNum();
      const prio = { low: "low", med: "medium", medium: "medium", high: "high" };
      for (const tk of parsed.tickets) {
        const num = tk.id && !used.has(tk.id) ? tk.id : n++;
        used.add(num);
        const entries = (tk.entries || []).map(e => ({ id: uid(), at: e.at || tk.createdAt || Date.now(), type: e.type || "note", text: e.text || "", pinned: !!e.pinned, editedAt: e.editedAt || null, images: e.images || [] }));
        if (tk.notes && tk.notes.trim() && !entries.length) entries.push({ id: uid(), at: tk.createdAt || Date.now(), type: "note", text: tk.notes, pinned: false, images: [] });
        writes.push(["tasks", normTask({
          id: uid(), num, title: tk.title || "Untitled", projectId: proj.id, status: tk.done ? "done" : "todo", priority: prio[tk.priority] || "none",
          start: tk.start || null, due: tk.due || null, assignee: tk.assignee || "", recur: tk.recur || "", tags: tk.tags || [], notes: "",
          subtasks: (tk.subtasks || []).map(s => ({ id: uid(), text: s.text || "", done: !!s.done, due: s.due || null })),
          entries, archived: !!tk.archived, createdAt: tk.createdAt || Date.now(), updatedAt: Date.now(), completedAt: tk.done ? (tk.closedAt || tk.createdAt || Date.now()) : null,
        })]);
      }
      (parsed.templates || []).forEach(tp => writes.push(["templates", { id: uid(), name: tp.name || "Template", priority: prio[tp.priority] || "none", tags: tp.tags || [], subtasks: tp.subtasks || [], notes: "", createdAt: Date.now() }]));
    } else { setResult({ error: "This doesn't look like a backup from this workspace or from the Work Order app, so nothing was changed." }); return; }
    // photos stored inside the old file move to this workspace's photo storage
    const photoJobs = [];
    writes.forEach(([c, o]) => c === "tasks" && (o.entries || []).forEach(e => (e.images || []).forEach((im, i) => { if (im && typeof im === "object" && im.dataUrl) photoJobs.push([e, i, im.dataUrl]); })));
    let step = 0; const total = writes.length + photoJobs.length;
    for (const [e, i, du] of photoJobs) {
      setProgress({ step: ++step, total, what: "Moving photos" });
      if (STANDALONE) { e.images[i] = du; uploaded++; continue; }
      if (!ASSETS) { e.images[i] = null; skippedImages++; continue; }
      try { const b = dataUrlToBlob(du); const r = await ASSETS.upload(b, { type: b.type === "image/png" ? "image/png" : b.type === "image/webp" ? "image/webp" : "image/jpeg" }); e.images[i] = r.id; uploaded++; }
      catch (err) { e.images[i] = null; skippedImages++; }
    }
    writes.forEach(([c, o]) => { if (c === "tasks") (o.entries || []).forEach(e => e.images = (e.images || []).filter(x => typeof x === "string")); });
    for (const [c, o] of writes) {
      setProgress({ step: ++step, total, what: "Saving" });
      await put(c, o);
      if (S.mode === "db") await sleep(25);
    }
    setProgress(null);
    const tasksN = writes.filter(w => w[0] === "tasks").length;
    setResult({ ok: `Imported ${tasksN} ${tasksN === 1 ? "task" : "tasks"}${uploaded ? ` and ${uploaded} photos` : ""}. Nothing you already had was removed.${skippedImages ? ` ${skippedImages} photos couldn't be moved.` : ""}` });
  };
  return html`<div class="pal-scrim" onMouseDown=${e => e.target === e.currentTarget && !progress && close()}>
    <div class="pal modal" role="dialog" aria-label="Backup and import">
      <div class="row" style=${{ padding: "14px 16px", borderBottom: "1px solid var(--line)" }}><h2 class="h2" style=${{ fontSize: 15, color: "var(--fg)" }}>Backup and import</h2><span class="spacer"></span><button class="icon-btn" aria-label="Close" onClick=${close} disabled=${!!progress}><${Icon} n="x" /></button></div>
      <div class="modal-body">
        <p class="muted" style=${{ margin: 0 }}>${st.mode === "db" ? "Your workspace saves to your account automatically and follows you to any device. A backup file is an extra copy you keep." : "Your workspace is only saved in this browser right now. Keep a backup file."}</p>
        <div class="mono muted" style=${{ fontSize: 12 }}>${counts.projects} projects · ${counts.tasks} tasks · ${counts.notes} notes · ${counts.templates} templates${st.mode === "local" ? ` · about ${(JSON.stringify({ a: st.projects, b: st.tasks, c: st.notes, d: st.templates }).length / 1048576).toFixed(1)} MB of roughly 5 MB browser storage` : ""}</div>
        <div class="data-grid">
          <button class="data-btn" onClick=${backup} disabled=${!st.caps.downloads}><${Icon} n="download" /><b>Save a backup</b><span>Everything, as a .json file</span></button>
          <button class="data-btn" onClick=${() => exportTasksCsv(sortTasks(Object.values(S.tasks), "due"), S)} disabled=${!st.caps.downloads}><${Icon} n="list" /><b>Export tasks to CSV</b><span>Opens in Excel or Sheets</span></button>
          <button class="data-btn" onClick=${() => fileRef.current && fileRef.current.click()} disabled=${!!progress}><${Icon} n="upload" /><b>Import a backup</b><span>From this workspace or your Work Order app</span></button>
        </div>
        <input ref=${fileRef} type="file" accept="application/json,.json" hidden onChange=${e => { const f = e.target.files[0]; e.target.value = ""; if (f) run(f); }} />
        ${!st.caps.downloads && html`<p class="muted" style=${{ margin: 0, fontSize: 12.5 }}>Saving files isn't available in this view.</p>`}
        ${progress && html`<div class="section" style=${{ gap: 6 }}><span>${progress.what}… <span class="mono">${progress.step}/${progress.total}</span></span><span class="bar"><i style=${{ width: (progress.step / progress.total * 100) + "%", background: "var(--accent)" }}></i></span></div>`}
        ${result && html`<div class=${"banner" + (result.error ? " bad" : " good")}>${result.error || result.ok}</div>`}
        <p class="muted" style=${{ margin: 0, fontSize: 12.5 }}>Importing adds to what you have. Work Order tickets go into a project called “Work Order” and keep their numbers, tags, owners, checklists, log entries and photos.</p>
      </div>
    </div>
  </div>`;
}

/* ---------- notes ---------- */
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])_([^_]+)_(?=[\s).,!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src) {
  const lines = (src || "").split("\n"); let out = "", inList = false, para = [];
  const flush = () => { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const endList = () => { if (inList) { out += "</ul>"; inList = false; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if (!l.trim()) { flush(); endList(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { flush(); endList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if (/^---+$/.test(l)) { flush(); endList(); out += "<hr>"; continue; }
    if ((m = l.match(/^>\s?(.*)/))) { flush(); endList(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/))) { flush(); if (!inList) { out += "<ul>"; inList = true; } const on = m[1] !== " "; out += `<li class="todo${on ? " done" : ""}"><span class="check${on ? " on" : ""}">${on ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5 10 17 19 7"/></svg>' : ""}</span><span>${inline(m[2])}</span></li>`; continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)/))) { flush(); if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(m[1])}</li>`; continue; }
    endList(); para.push(l);
  }
  flush(); endList();
  return out;
}

    <div class="props" style=${{ gridTemplateColumns: "96px minmax(0,1fr)" }}>
      <span class="pk"><${Icon} n="folder" />Project</span>
      <select value=${note.projectId || ""} onChange=${e => patch("notes", note.id, { projectId: e.target.value || null, updatedAt: Date.now() })} aria-label="Note project"><option value="">No project</option>${projects.map(x => html`<option key=${x.id} value=${x.id}>${x.name || "Untitled"}</option>`)}</select>
      <span class="pk"><${Icon} n="edit" />Edited</span><span class="muted">${new Date(note.updatedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })} · <span class="mono">${words}</span> words</span>
    </div>
    <hr style=${{ border: 0, borderTop: "1px solid var(--line)", margin: 0, width: "100%" }} />
    ${read
      ? html`<div class="md" onDoubleClick=${() => setRead(false)} dangerouslySetInnerHTML=${{ __html: md(body) || '<p class="muted">Empty note. Switch to Write to start.</p>' }}></div>`
      : html`<${AutoText} className="body-area" value=${body} onChange=${setBody} placeholder="Start writing. Use # for headings, - for bullets, - [ ] for checklists, **bold**." ariaLabel="Note body" />`}
    <div><button class=${"btn danger" + (armed ? " armed" : "")} onClick=${() => { if (!armed) return setArmed(true); remove("notes", note.id); go({ view: "notes" }); }}><${Icon} n="trash" />${armed ? "Click again to delete" : "Delete note"}</button></div>
  </div>`;
}

function NotesView({ st, id, go }) {
  const [q, setQ] = useState("");
  const notes = Object.values(st.notes).filter(n => !q || (n.title + " " + n.body).toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt);
  const note = id && st.notes[id];
  return html`<div class=${"notes-wrap" + (note ? " has-note" : "")}>
    <div class="notes-list">
      <div class="row" style=${{ padding: "0 4px 8px" }}><h1 class="h1" style=${{ fontSize: 24 }}>Notes</h1><span class="spacer"></span>
        <button class="btn" onClick=${() => { const n = newNote({}); go({ view: "notes", id: n.id }); }}><${Icon} n="plus" />New</button></div>
      <div class="search"><input class="input" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search notes" aria-label="Search notes" /></div>
      ${notes.map(n => {
        const p = st.projects[n.projectId];
        return html`<button key=${n.id} class=${"note-item" + (note && note.id === n.id ? " on" : "")} onClick=${() => go({ view: "notes", id: n.id })}>
          <span class="nt">${n.pinned ? "· " : ""}${n.title || "Untitled"}</span>
          <span class="np">${preview(n.body, 80) || "Empty note"}</span>
          <span class="nm">${p && html`<span class="dot" style=${{ background: pcolor(p) }}></span>`}${p ? p.name : ""}${p ? " · " : ""}${ago(n.updatedAt)}</span>
        </button>`;
      })}
      ${notes.length === 0 && html`<div class="empty">${q ? "No notes match." : "No notes yet. Write one for meeting notes, ideas or plans."}</div>`}
    </div>
    <div class="note-ed">
      ${note ? html`<${NoteEditor} key=${note.id} note=${note} st=${st} go=${go} />`
        : html`<div class="loading"><div style=${{ textAlign: "center", display: "grid", gap: 10, justifyItems: "center" }}><span>Pick a note or start a new one.</span>
          <button class="btn primary" onClick=${() => { const n = newNote({}); go({ view: "notes", id: n.id }); }}><${Icon} n="plus" />New note</button></div></div>`}
    </div>
  </div>`;
}

/* ---------- timeline ---------- */
function TimelineView({ st, openTask }) {
  const [zoom, setZoom] = useState(() => { try { return localStorage.getItem("workspace.zoom") || "month"; } catch (e) { return "month"; } });
  const [anchor, setAnchor] = useState(today());
  const [drag, setDrag] = useState(null);
  const [hideDone, setHideDone] = useState(false);
  const wrapRef = useRef(null);
  const narrow = typeof window !== "undefined" && window.innerWidth < 760;
  const cfg = { week: { days: 21, w: 52, back: 3 }, month: { days: 49, w: 30, back: 7 }, quarter: { days: 105, w: 13, back: 14 } }[zoom];
  const start = addDays(anchor, -cfg.back);
  const dayW = cfg.w, LW = narrow ? 150 : 240, W = cfg.days * dayW;
  const t0 = today();
  const setZ = z => { setZoom(z); try { localStorage.setItem("workspace.zoom", z); } catch (e) {} };
  const projects = Object.values(st.projects).sort((a, b) => a.createdAt - b.createdAt);
  const tasks = Object.values(st.tasks).filter(t => !isArchived(t) && !(hideDone && t.status === "done"));
  const span = t => {
    let s = t.start || t.due, e = t.due || t.start;
    if (drag && drag.id === t.id) { s = drag.s; e = drag.e; }
    return [s, e];
  };
  const groups = [...projects.map(p => ({ p, list: tasks.filter(t => t.projectId === p.id && (t.start || t.due)) })), { p: null, list: tasks.filter(t => !t.projectId && (t.start || t.due)) }]
    .filter(g => g.list.length || g.p).map(g => ({ ...g, list: g.list.slice().sort((a, b) => (span(a)[0] < span(b)[0] ? -1 : span(a)[0] > span(b)[0] ? 1 : 0)) }));
  const undated = Object.values(st.tasks).filter(t => t.status !== "done" && !t.start && !t.due);

  const onDown = (e, t, kind) => {
    e.stopPropagation(); e.preventDefault();
    const [s, en] = span(t);
    const x0 = e.clientX;
    const el = e.currentTarget; try { el.setPointerCapture(e.pointerId); } catch (_) {}
    let moved = false, cur = { id: t.id, s, e: en };
    const move = ev => {
      const d = Math.round((ev.clientX - x0) / dayW);
      if (Math.abs(ev.clientX - x0) > 3) moved = true;
      if (kind === "move") cur = { id: t.id, s: addDays(s, d), e: addDays(en, d) };
      else if (kind === "l") { const ns = addDays(s, d); cur = { id: t.id, s: ns > en ? en : ns, e: en }; }
      else { const ne = addDays(en, d); cur = { id: t.id, s, e: ne < s ? s : ne }; }
      setDrag(cur);
    };
    const up = () => {
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
      setDrag(null);
      if (!moved) { openTask(t.id); return; }
      if (cur.s !== s || cur.e !== en) {
        const single = !t.start || !t.due;
        if (single && cur.s === cur.e) patch("tasks", t.id, t.due ? { due: cur.e, start: t.start ? cur.s : null, updatedAt: Date.now() } : { start: cur.s, updatedAt: Date.now() });
        else patch("tasks", t.id, { start: cur.s, due: cur.e, updatedAt: Date.now() });
      }
    };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  };

  useEffect(() => {
    const el = wrapRef.current; if (!el) return;
    el.scrollLeft = 0;
  }, [zoom, anchor]);

  const months = [];
  for (let i = 0; i < cfg.days; i++) { const d = parseDate(addDays(start, i)); if (i === 0 || d.getDate() === 1) months.push({ i, label: MON[d.getMonth()] + " " + d.getFullYear() }); }
  const dayLabels = [];
  for (let i = 0; i < cfg.days; i++) {
    const ds = addDays(start, i), d = parseDate(ds);
    const show = zoom === "quarter" ? d.getDay() === 1 : zoom === "month" ? true : true;
    if (show) dayLabels.push({ i, label: zoom === "week" ? DOW[d.getDay()].slice(0, 2) + " " + d.getDate() : d.getDate(), today: ds === t0 });
  }
  const weekends = [];
  for (let i = 0; i < cfg.days; i++) { const g = parseDate(addDays(start, i)).getDay(); if (g === 0 || g === 6) weekends.push(i); }
  const todayX = diffDays(start, t0) * dayW;

  const bar = (t, p) => {
    const [s, e] = span(t);
    const x = diffDays(start, s) * dayW, w = (diffDays(s, e) + 1) * dayW;
    if (x + w < 0 || x > W) return null;
    const col = p ? pcolor(p) : "var(--muted)";
    const isMile = s === e && w < 40;
    const dragging = drag && drag.id === t.id;
    if (isMile) return html`<div class="tl-milestone" style=${{ left: x + dayW / 2 - 7, background: col, opacity: t.status === "done" ? .45 : 1 }} title=${(t.title || "Untitled") + " · " + dueLabel(s)} onPointerDown=${ev => onDown(ev, t, "move")}></div>`;
    return html`<div class=${"tl-bar" + (t.status === "done" ? " done" : "") + (dragging ? " dragging" : "")} style=${{ left: x + 1, width: w - 2, background: col }} title=${`${t.title || "Untitled"} · ${dueLabel(s)} to ${dueLabel(e)}`} onPointerDown=${ev => onDown(ev, t, "move")}>
      <span class="h l" onPointerDown=${ev => onDown(ev, t, "l")}></span>
      ${w > 60 ? (t.title || "Untitled") : ""}
      <span class="h r" onPointerDown=${ev => onDown(ev, t, "r")}></span>
    </div>`;
  };

  const bgLayer = html`<div class="tl-bg" style=${{ left: 0, width: W }}>
    ${weekends.map(i => html`<div key=${i} class="tl-we" style=${{ left: i * dayW, width: dayW }}></div>`)}
  </div>`;

  return html`<div class="page wide">
    <div><div class="crumb"><${Icon} n="timeline" /> Every project</div><h1 class="h1">Timeline</h1><p class="sub">Drag a bar to move it, drag its edges to change the dates. Tasks with only a due date show as a diamond.</p></div>
    <div class="row">
      <div class="seg">${[["week", "Weeks"], ["month", "Month"], ["quarter", "Quarter"]].map(([k, l]) => html`<button key=${k} class=${zoom === k ? "on" : ""} onClick=${() => setZ(k)}>${l}</button>`)}</div>
      <button class="icon-btn" aria-label="Earlier" onClick=${() => setAnchor(addDays(anchor, -Math.round(cfg.days / 3)))}><${Icon} n="arrowL" /></button>
      <button class="btn" onClick=${() => setAnchor(today())}>Today</button>
      <button class="icon-btn" aria-label="Later" onClick=${() => setAnchor(addDays(anchor, Math.round(cfg.days / 3)))}><${Icon} n="arrowR" /></button>
      <span class="spacer"></span>
      <label class="row muted" style=${{ gap: 6, fontSize: 13 }}><input type="checkbox" checked=${hideDone} onChange=${e => setHideDone(e.target.checked)} />Hide done</label>
    </div>
    <div class="tl-wrap" ref=${wrapRef}>
      <div class="tl" style=${{ width: LW + W }}>
        <div class="tl-head">
          <div class="tl-row" style=${{ height: 44 }}>
            <div class="tl-label" style=${{ width: LW }}>${projects.length} projects</div>
            <div style=${{ width: W, position: "relative" }}>
              <div class="tl-months">${months.map(m => html`<span key=${m.i} style=${{ left: m.i * dayW }}>${m.label}</span>`)}</div>
              <div class="tl-days">${dayLabels.map(d => html`<span key=${d.i} class=${d.today ? "today" : ""} style=${{ left: d.i * dayW, width: zoom === "quarter" ? dayW * 3 : dayW, textAlign: zoom === "quarter" ? "left" : "center" }}>${d.label}</span>`)}</div>
            </div>
          </div>
        </div>
        ${groups.map(g => {
          const sp = g.list.length ? [g.list.map(t => span(t)[0]).sort()[0], g.list.map(t => span(t)[1]).sort().slice(-1)[0]] : null;
          return html`<div key=${g.p ? g.p.id : "none"}>
            <div class="tl-row proj">
              <div class="tl-label" style=${{ width: LW }}><span class="dot" style=${{ background: g.p ? pcolor(g.p) : "var(--muted)" }}></span><span class="t">${g.p ? (g.p.name || "Untitled") : "No project"}</span><span class="muted mono" style=${{ fontSize: 11, fontWeight: 400 }}>${g.list.length}</span></div>
              <div class="tl-track" style=${{ width: W }}>${bgLayer}
                ${sp && html`<div class="tl-span" style=${{ left: diffDays(start, sp[0]) * dayW, width: (diffDays(sp[0], sp[1]) + 1) * dayW, background: g.p ? pcolor(g.p) : "var(--muted)" }}></div>`}
              </div>
            </div>
            ${g.list.map(t => html`<div key=${t.id} class="tl-row">
              <div class="tl-label" style=${{ width: LW }} onClick=${() => openTask(t.id)}><span class="t" style=${t.status === "done" ? { color: "var(--muted)", textDecoration: "line-through" } : null}>${t.title || "Untitled"}</span></div>
              <div class="tl-track" style=${{ width: W }}>${bgLayer}${bar(t, g.p)}</div>
            </div>`)}
            ${g.p && g.list.length === 0 && html`<div class="tl-row"><div class="tl-label muted" style=${{ width: LW, fontSize: 12.5 }}>No dated tasks</div><div class="tl-track" style=${{ width: W }}>${bgLayer}</div></div>`}
          </div>`;
        })}
        ${todayX >= 0 && todayX <= W && html`<div class="tl-today" style=${{ left: LW + todayX + dayW / 2 - 1 }}></div>`}
      </div>
    </div>
    ${groups.length === 0 && html`<div class="empty">Create a project and give its tasks start or due dates to see them here.</div>`}
    ${undated.length > 0 && html`<div class="section">
      <h3 class="h2">Not scheduled <span class="n">${undated.length}</span></h3>
      <div class="list">${sortTasks(undated).slice(0, 12).map(t => html`<div key=${t.id} class="task" onClick=${() => openTask(t.id)}>
        <span class="dot" style=${{ background: st.projects[t.projectId] ? pcolor(st.projects[t.projectId]) : "var(--muted)" }}></span>
        <span class="t">${t.title || "Untitled"}</span>
        <button class="btn" onClick=${e => { e.stopPropagation(); patch("tasks", t.id, { start: today(), due: addDays(today(), 2), updatedAt: Date.now() }); }}>Schedule from today</button>
      </div>`)}</div>
    </div>`}
  </div>`;
}

/* ---------- search palette ---------- */
function Palette({ st, close, go, openTask }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const ql = q.trim().toLowerCase();
  const items = [];
  if (ql) {
    Object.values(st.projects).forEach(p => (p.name || "").toLowerCase().includes(ql) && items.push({ k: "Project", icon: "folder", label: p.name, act: () => go({ view: "project", id: p.id }) }));
    sortTasks(Object.values(st.tasks)).forEach(t => matchesSearch(t, ql, st) && items.push({ k: isArchived(t) ? "Archived" : t.status === "done" ? "Done task" : "Task", icon: t.status === "done" ? "done" : "check", label: (t.num ? fmtNum(t.num) + "  " : "") + (t.title || "Untitled"), act: () => openTask(t.id) }));
    Object.values(st.notes).forEach(n => ((n.title || "") + " " + (n.body || "")).toLowerCase().includes(ql) && items.push({ k: "Note", icon: "note", label: n.title || "Untitled", act: () => go({ view: "notes", id: n.id }) }));
    items.push({ k: "Create", icon: "plus", label: `New task “${q.trim()}”`, act: () => openTask(newTask({ title: q.trim() }).id) });
  } else {
    items.push({ k: "Create", icon: "plus", label: "New task", act: () => openTask(newTask({}).id) });
    items.push({ k: "Create", icon: "note", label: "New note", act: () => go({ view: "notes", id: newNote({}).id }) });
    items.push({ k: "Create", icon: "folder", label: "New project", act: () => go({ view: "project", id: newProject({}).id, fresh: true }) });
    items.push({ k: "Go to", icon: "home", label: "Dashboard", act: () => go({ view: "dashboard" }) });
    items.push({ k: "Go to", icon: "sun", label: "Tasks", act: () => go({ view: "today" }) });
    items.push({ k: "Go to", icon: "steps", label: "Checklist", act: () => go({ view: "checklist" }) });
    items.push({ k: "Go to", icon: "grid", label: "Calendar", act: () => go({ view: "calendar" }) });
    items.push({ k: "Go to", icon: "timeline", label: "Timeline", act: () => go({ view: "timeline" }) });
  }
  const list = items.slice(0, 40);
  const run = it => { close(); it.act(); };
  return html`<div class="pal-scrim" onMouseDown=${e => e.target === e.currentTarget && close()}>
    <div class="pal" role="dialog" aria-label="Search">
      <input autoFocus value=${q} placeholder="Search tasks, notes and projects" aria-label="Search" onInput=${e => { setQ(e.target.value); setSel(0); }}
        onKeyDown=${e => {
          if (e.key === "Escape") close();
          else if (e.key === "ArrowDown") { e.preventDefault(); setSel(Math.min(list.length - 1, sel + 1)); }
          else if (e.key === "ArrowUp") { e.preventDefault(); setSel(Math.max(0, sel - 1)); }
          else if (e.key === "Enter" && list[sel]) run(list[sel]);
        }} />
      <div class="pal-res">${list.map((it, i) => html`<button key=${i} class=${"pal-item" + (i === sel ? " on" : "")} onMouseEnter=${() => setSel(i)} onClick=${() => run(it)}><${Icon} n=${it.icon} /><span>${it.label}</span><span class="k">${it.k}</span></button>`)}</div>
    </div>
  </div>`;
}

/* ---------- app ---------- */
function App() {
  const st = useStore();
  const [route, setRoute] = useState(() => { try { const r = JSON.parse(localStorage.getItem("workspace.route") || "null"); if (r && r.view) return { ...r, fresh: false }; } catch (e) {} return { view: "dashboard" }; });
  const [taskId, setTaskId] = useState(null);
  const [side, setSide] = useState(false);
  const [pal, setPal] = useState(false);
  const [data, setData] = useState(false);
  const mainRef = useRef(null);
  const go = useCallback(r => { setRoute(r); setSide(false); setTaskId(null); try { localStorage.setItem("workspace.route", JSON.stringify(r)); } catch (e) {} if (mainRef.current) mainRef.current.scrollTop = 0; }, []);
  const openTask = useCallback(id => { setTaskId(id); setSide(false); }, []);
  useEffect(() => {
    const k = e => {
      const tag = (e.target.tagName || "").toLowerCase();
      const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
      if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && !typing)) { e.preventDefault(); setPal(true); }
    };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, []);
  useEffect(() => { if (st.mode !== "loading") window.__appReady = true; }, [st.mode]);
  if (st.mode === "failed") return html`<div class="loading"><div style=${{ display: "grid", gap: 10, justifyItems: "center", textAlign: "center", maxWidth: 440, padding: "0 16px" }}>
    <b style=${{ fontSize: 15 }}>Your workspace couldn't open</b><span>${st.failReason}</span><button class="btn primary" onClick=${() => location.reload()}>Reload</button></div></div>`;
  if (st.mode === "loading") return html`<div class="loading"><div style=${{ display: "grid", gap: 10, justifyItems: "center" }}><div class="skel"></div><div class="skel" style=${{ width: 160 }}></div><div>Opening your workspace</div></div></div>`;
  const view = route.view === "project" && !st.projects[route.id] && !route.fresh ? "dashboard" : route.view;
  const titles = { dashboard: "Dashboard", today: "Tasks", checklist: "Checklist", calendar: "Calendar", timeline: "Timeline", notes: "Notes", project: (st.projects[route.id] || {}).name || "Project" };
  return html`<div class="shell">
    <${Sidebar} st=${st} route=${{ ...route, view }} go=${go} open=${side} onSearch=${() => { setSide(false); setPal(true); }} onData=${() => { setSide(false); setData(true); }} />
    <div class=${"scrim" + (side ? " open" : "")} onClick=${() => setSide(false)}></div>
    <main class="main" ref=${mainRef}>
      <div class="topbar"><button class="icon-btn" aria-label="Open menu" onClick=${() => setSide(true)}><${Icon} n="menu" /></button><b style=${{ fontWeight: 600 }}>${titles[view] || ""}</b><span class="spacer"></span><button class="icon-btn" aria-label="Search" onClick=${() => setPal(true)}><${Icon} n="search" /></button></div>
      ${view === "dashboard" && html`<${Dashboard} st=${st} go=${go} openTask=${openTask} />`}
      ${view === "today" && html`<${TasksView} st=${st} openTask=${openTask} />`}
      ${view === "checklist" && html`<${ChecklistView} st=${st} openTask=${openTask} />`}
      ${view === "calendar" && html`<${CalendarView} st=${st} openTask=${openTask} />`}
      ${view === "project" && html`<${ProjectView} key=${route.id} st=${st} id=${route.id} fresh=${route.fresh} go=${go} openTask=${openTask} />`}
      ${view === "notes" && html`<${NotesView} st=${st} id=${route.id} go=${go} />`}
      ${view === "timeline" && html`<${TimelineView} st=${st} openTask=${openTask} />`}
    </main>
    ${taskId && st.tasks[taskId] && html`<${TaskPanel} key=${taskId} st=${st} id=${taskId} close=${() => setTaskId(null)} go=${go} openTask=${openTask} />`}
    ${pal && html`<${Palette} st=${st} close=${() => setPal(false)} go=${go} openTask=${openTask} />`}
    ${data && html`<${DataModal} st=${st} close=${() => setData(false)} />`}
    ${st.toast && html`<div class=${"toast" + (st.toast.kind === "error" ? " err" : "")} role="status">${st.toast.text}
      ${st.toast.undo && html`<button onClick=${() => { const u = st.toast.undo; toast(null); u(); }}>Undo</button>`}
      <button onClick=${() => toast(null)}>${st.toast.kind === "error" ? "Dismiss" : "OK"}</button></div>`}
  </div>`;
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div class="loading"><div style=${{ display: "grid", gap: 10, justifyItems: "center", textAlign: "center", maxWidth: 440, padding: "0 16px" }}>
      <b style=${{ fontSize: 15 }}>Something broke on this screen</b><span>Your data is safe. Reload to keep going.</span>
      <span class="muted mono" style=${{ fontSize: 11.5 }}>${String(this.state.err && this.state.err.message || this.state.err)}</span>
      <button class="btn primary" onClick=${() => { try { localStorage.removeItem("workspace.route"); } catch (e) {} location.reload(); }}>Reload</button></div></div>`;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${Boundary}><${App} /><//>`);
</script>

<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").catch(function (err) { console.error("Offline support didn't start", err); });
  });
}
</script>
